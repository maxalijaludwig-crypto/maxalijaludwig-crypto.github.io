<!DOCTYPE html>
<html lang="de" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARD Reporter App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            color-scheme: dark;
            --spring: cubic-bezier(0.22, 1, 0.36, 1);
            --spring-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
            --header-h: 64px;
            --search-h: 66px;
        }
        * { -webkit-tap-highlight-color: transparent; }
        body {
            font: 100%/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000000;
            color: #ffffff;
            overscroll-behavior-y: none;
        }
        .glass {
            background-color: rgba(0, 0, 0, 0.72);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
        }
        .card-bg { background-color: #1c1c1e; }
        .border-subtle { border-color: rgba(255,255,255,0.08); }
        .text-apple-red { color: #ff453a; }
        .bg-apple-red { background-color: #ff453a; }
        .bg-apple-green { background-color: #30d158; }
        .text-apple-blue { color: #0a84ff; }
        .bg-apple-blue { background-color: #0a84ff; }
        .text-apple-yellow { color: #ffd60a; }

        /* Display type: tight tracking + leading, per Apple typography rules */
        .type-display {
            letter-spacing: -0.02em;
            line-height: 1.05;
            font-optical-sizing: auto;
        }
        .type-headline {
            letter-spacing: -0.012em;
            line-height: 1.15;
        }
        .type-caption {
            letter-spacing: 0.02em;
        }

        /* Smooth, spring-flavored state transitions */
        #workflow-card { transition: box-shadow 0.4s var(--spring); }
        .fade-in { animation: fadeIn 0.45s var(--spring) both; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Instant press feedback (respond on pointer-down, not release) */
        .press { transition: transform 0.12s var(--spring), background-color 0.15s var(--spring); }
        .press:active { transform: scale(0.96); }
        .press-sm:active { transform: scale(0.98); }

        button:focus-visible, input:focus-visible, [tabindex]:focus-visible {
            outline: 2px solid #0a84ff;
            outline-offset: 2px;
        }

        /* Pulse Animation — only for users who allow motion */
        @media (prefers-reduced-motion: no-preference) {
            @keyframes ios-pulse {
                0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(48, 209, 88, 0.7); }
                70% { transform: scale(1.02); box-shadow: 0 0 0 20px rgba(48, 209, 88, 0); }
                100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(48, 209, 88, 0); }
            }
            .btn-pulse-green { animation: ios-pulse 2.2s infinite; }

            @keyframes ios-pulse-red {
                0% { transform: scale(1); opacity: 1; }
                50% { transform: scale(1.15); opacity: 0.6; }
                100% { transform: scale(1); opacity: 1; }
            }
            .dot-pulse-red { animation: ios-pulse-red 1.4s infinite; }
        }
        @media (prefers-reduced-motion: reduce) {
            .btn-pulse-green { box-shadow: 0 0 0 8px rgba(48, 209, 88, 0.15); }
            * { animation-duration: 0.001ms !important; transition-duration: 150ms !important; }
        }

        /* Checkmark pop when a station is selected */
        @keyframes checkPop {
            0% { transform: scale(0.4); opacity: 0; }
            60% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .check-pop { animation: checkPop 0.35s var(--spring-bounce) both; }

        /* Sticky section chrome */
        .sticky-search {
            position: sticky; top: 0; z-index: 30;
        }
        .sticky-group-header {
            position: sticky; top: var(--search-h); z-index: 20;
        }

        /* Segmented control */
        .segmented { background: #1c1c1e; border: 1px solid rgba(255,255,255,0.08); }
        .segmented button { transition: background-color 0.25s var(--spring), color 0.25s var(--spring); }
        .segmented button.active { background: #3a3a3c; color: #fff; }
        .segmented button:not(.active) { color: #8e8e93; }

        /* A–Z index rail */
        #az-index {
            position: fixed; right: 2px; top: 50%; transform: translateY(-50%);
            z-index: 40; display: none; flex-direction: column; align-items: center;
            padding: 4px 3px; border-radius: 12px;
        }
        #az-index.visible { display: flex; }
        #az-index button {
            font-size: 10px; font-weight: 600; color: #0a84ff; line-height: 1.5;
            width: 16px; text-align: center;
        }

        .station-item[data-selected="true"] { background-color: rgba(10, 132, 255, 0.1); }

        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

    <header class="glass sticky top-0 z-50 border-b border-subtle flex justify-between items-center px-5 py-4 shrink-0">
        <div class="flex flex-col">
            <span class="text-[11px] font-semibold type-caption uppercase text-gray-400" id="nav-state-label">Systemstatus</span>
            <div class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-apple-green shrink-0" id="nav-state-dot"></span>
                <span class="text-lg font-bold type-headline text-white" id="nav-state-text">Standby</span>
            </div>
        </div>
        <img src="https://upload.wikimedia.org/wikipedia/commons/2/23/Logo_ARD.svg" alt="ARD Logo" class="h-8 w-auto object-contain" onerror="this.style.display='none'">
    </header>

    <main class="flex-1 overflow-y-auto pb-16">

        <div class="p-4 w-full max-w-md mx-auto">
            <div id="workflow-card" class="card-bg border border-subtle rounded-3xl p-6 shadow-2xl flex flex-col items-center justify-center min-h-[380px] relative overflow-hidden"></div>
        </div>

        <div class="w-full max-w-md mx-auto mt-1" id="directory-section">

            <div class="sticky-search glass px-4 pt-1 pb-3">
                <div class="relative mb-3">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                    </div>
                    <input type="search" id="search-input" placeholder="Sender oder Rundfunkanstalt suchen..."
                        class="w-full card-bg border border-subtle rounded-[10px] py-2.5 pl-10 pr-4 text-white placeholder-gray-500 focus:outline-none focus:border-gray-400 text-base transition-colors">
                </div>

                <div class="flex items-center justify-between gap-2">
                    <div class="segmented flex rounded-lg p-0.5 text-xs font-semibold" id="view-toggle" role="tablist">
                        <button data-mode="grouped" class="press-sm active px-3 py-1.5 rounded-md">Nach Anstalt</button>
                        <button data-mode="az" class="press-sm px-3 py-1.5 rounded-md">A–Z</button>
                    </div>
                    <div id="selection-chip" class="hidden items-center gap-1.5 bg-apple-blue/15 border border-apple-blue/30 text-apple-blue text-xs font-semibold pl-2.5 pr-1.5 py-1 rounded-full press-sm"></div>
                </div>
            </div>

            <div id="directory-list" class="pb-4"></div>
        </div>
    </main>

    <div id="az-index"></div>

    <div id="alert-overlay" class="fixed inset-0 z-[100] hidden items-center justify-center p-4">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="App.hideAlert()"></div>
        <div class="card-bg border border-subtle rounded-2xl w-full max-w-[300px] text-center z-10 overflow-hidden shadow-2xl transform transition-transform duration-300 scale-95" style="transition-timing-function: var(--spring-bounce);">
            <div class="p-6">
                <h3 class="text-lg font-bold text-white mb-2 type-headline">Mikrofon erforderlich</h3>
                <p class="text-sm text-gray-400">Bitte erlaube den Mikrofonzugriff in deinen Browsereinstellungen, um auf Sendung zu gehen.</p>
            </div>
            <div class="border-t border-subtle flex">
                <button onclick="App.hideAlert()" class="w-full py-3.5 text-apple-blue font-semibold text-base active:bg-white/5 transition-colors press-sm">Verstanden</button>
            </div>
        </div>
    </div>

        // --- CORE APPLICATION LOGIC ---
        const App = {
            state: 'STANDBY', // STANDBY, PREP, LIVE
            audioCtx: null,
            mediaStream: null,
            analyser: null,
            timerInterval: null,
            visualizerFrame: null,
            targetStation: null,     // the station actually used for the current/next Schalte
            selectedStation: null,   // user-picked station (persists until cleared); null = zufällig
            viewMode: 'grouped',     // 'grouped' | 'az'
            searchTerm: '',
            flatSenderList: [],

            init() {
                this.sortData();
                this.setupSearch();
                this.setupViewToggle();
                this.renderDirectory();
                this.renderStateStandby();
            },

            // --- DATA PREP: sort alphabetically (de-DE) & build flat A–Z list ---
            sortData() {
                const collator = new Intl.Collator('de', { sensitivity: 'base' });
                appData.rundfunkanstalten.sort((a, b) => collator.compare(a.anstalt, b.anstalt));
                appData.rundfunkanstalten.forEach(a => a.sender.sort((x, y) => collator.compare(x.name, y.name)));

                this.flatSenderList = appData.rundfunkanstalten.flatMap(a =>
                    a.sender.map(s => ({ ...s, anstalt: a.anstalt }))
                ).sort((a, b) => collator.compare(a.name, b.name));
            },

            // --- AUDIO & PERMISSIONS ---
            async requestMicrophone() {
                try {
                    this.mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });

                    if (!this.audioCtx) {
                        this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    }
                    if (this.audioCtx.state === 'suspended') {
                        await this.audioCtx.resume();
                    }

                    const source = this.audioCtx.createMediaStreamSource(this.mediaStream);
                    this.analyser = this.audioCtx.createAnalyser();
                    this.analyser.fftSize = 64;
                    this.analyser.smoothingTimeConstant = 0.8;
                    source.connect(this.analyser);

                    return true;
                } catch (err) {
                    this.showAlert();
                    return false;
                }
            },

            stopMicrophone() {
                if (this.mediaStream) {
                    this.mediaStream.getTracks().forEach(track => track.stop());
                    this.mediaStream = null;
                }
                if (this.visualizerFrame) {
                    cancelAnimationFrame(this.visualizerFrame);
                }
            },

            playBeep(frequency, durationMillis, type = 'sine') {
                if (!this.audioCtx) return;
                const osc = this.audioCtx.createOscillator();
                const gainNode = this.audioCtx.createGain();

                osc.type = type;
                osc.frequency.setValueAtTime(frequency, this.audioCtx.currentTime);

                gainNode.gain.setValueAtTime(0.1, this.audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + (durationMillis / 1000));

                osc.connect(gainNode);
                gainNode.connect(this.audioCtx.destination);

                osc.start();
                osc.stop(this.audioCtx.currentTime + (durationMillis / 1000));
            },

            haptic(ms = 8) {
                if (navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} }
            },

            // --- UI STATES ---
            updateNav(text, colorClass = "text-white", dotClass = "bg-apple-green") {
                const navText = document.getElementById('nav-state-text');
                navText.textContent = text;
                navText.className = `text-lg font-bold type-headline ${colorClass}`;
                const dot = document.getElementById('nav-state-dot');
                dot.className = `w-2 h-2 rounded-full shrink-0 ${dotClass}`;
            },

            pickRandomStation() {
                const allAnstalten = appData.rundfunkanstalten;
                const rAnstalt = allAnstalten[Math.floor(Math.random() * allAnstalten.length)];
                const rSender = rAnstalt.sender[Math.floor(Math.random() * rAnstalt.sender.length)];
                return { ...rSender, anstalt: rAnstalt.anstalt };
            },

            renderStateStandby() {
                this.state = 'STANDBY';
                this.updateNav('Standby', 'text-white', 'bg-apple-green');

                const card = document.getElementById('workflow-card');
                const sel = this.selectedStation;

                const previewHtml = sel ? `
                    <button onclick="App.scrollToDirectory()" class="press w-full flex items-center gap-3 bg-[#2c2c2e] hover:bg-[#333335] border border-subtle rounded-2xl p-3 text-left">
                        <div class="h-12 w-16 bg-[#1c1c1e] rounded-lg flex items-center justify-center shrink-0 overflow-hidden">
                            <img src="${sel.logo}" class="max-h-full max-w-full object-contain" onerror="this.style.display='none'">
                        </div>
                        <div class="min-w-0 flex-1">
                            <p class="text-[11px] uppercase type-caption font-semibold text-apple-blue">Ausgewählter Sender</p>
                            <p class="text-base font-semibold type-headline truncate">${sel.name}</p>
                            <p class="text-xs text-gray-500 truncate">${sel.anstalt}</p>
                        </div>
                        <svg class="h-4 w-4 text-gray-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    </button>
                    <button onclick="App.clearSelection()" class="press-sm mt-2 text-xs text-gray-500 hover:text-gray-300 font-medium">Zufällig statt fest wählen</button>
                ` : `
                    <button onclick="App.scrollToDirectory()" class="press w-full flex items-center gap-3 bg-[#2c2c2e] hover:bg-[#333335] border border-subtle rounded-2xl p-3 text-left">
                        <div class="h-12 w-16 bg-[#1c1c1e] rounded-lg flex items-center justify-center shrink-0 text-2xl">
                            🎲
                        </div>
                        <div class="min-w-0 flex-1">
                            <p class="text-[11px] uppercase type-caption font-semibold text-gray-400">Nächste Schalte</p>
                            <p class="text-base font-semibold type-headline">Zufällige Auswahl</p>
                            <p class="text-xs text-gray-500">Tippe, um einen festen Sender zu wählen</p>
                        </div>
                        <svg class="h-4 w-4 text-gray-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    </button>
                `;

                card.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full w-full space-y-6 fade-in">
                        <p class="text-gray-400 text-sm font-medium type-caption uppercase text-center">System bereit für Verbindung</p>
                        <button onclick="App.handleBereitClick()"
                            class="w-44 h-44 rounded-full bg-apple-green text-white font-bold text-2xl type-display btn-pulse-green shadow-[0_0_40px_rgba(48,209,88,0.4)] press flex items-center justify-center">
                            BEREIT
                        </button>
                        <div class="w-full">${previewHtml}</div>
                    </div>
                `;
            },

            scrollToDirectory() {
                const el = document.getElementById('directory-section');
                if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
            },

            async handleBereitClick() {
                const granted = await this.requestMicrophone();
                if (granted) {
                    this.targetStation = this.selectedStation || this.pickRandomStation();
                    this.renderStatePrep();
                }
            },

            renderStatePrep() {
                this.state = 'PREP';
                this.updateNav('Vorbereitung', 'text-apple-yellow', 'bg-apple-yellow');

                const wasSelected = !!this.selectedStation;

                const card = document.getElementById('workflow-card');
                card.innerHTML = `
                    <div class="flex flex-col items-center w-full fade-in">
                        <span class="text-xs font-semibold type-caption uppercase text-gray-400 mb-2">${wasSelected ? 'Nächste Schalte auf' : 'Nächste Schalte auf (zufällig)'}</span>
                        <h2 class="text-2xl font-bold type-display mb-1 text-center">${this.targetStation.name}</h2>
                        <p class="text-xs text-gray-500 mb-4">${this.targetStation.anstalt}</p>

                        <div class="bg-[#2c2c2e] p-3 rounded-xl mb-8 w-48 h-24 flex items-center justify-center">
                            <img src="${this.targetStation.logo}" alt="Logo" class="max-h-full max-w-full object-contain" onerror="this.style.display='none'">
                        </div>

                        <div class="relative flex items-center justify-center w-32 h-32 rounded-full border-4 border-yellow-500/30">
                            <svg class="absolute inset-0 w-full h-full -rotate-90">
                                <circle cx="50%" cy="50%" r="46%" fill="none" stroke="#eab308" stroke-width="8" stroke-dasharray="100 100" class="transition-all duration-1000 ease-linear" id="prep-circle"></circle>
                            </svg>
                            <span class="text-4xl font-light tabular-nums" id="prep-timer">01:00</span>
                        </div>
                    </div>
                `;

                this.startTimer(60,
                    (timeLeft) => {
                        document.getElementById('prep-timer').textContent = this.formatTime(timeLeft);
                        if (timeLeft === 3 || timeLeft === 2 || timeLeft === 1) {
                            this.playBeep(880, 150);
                        }
                    },
                    () => {
                        this.playBeep(880, 600);
                        this.renderStateLive();
                    }
                );
            },

            renderStateLive() {
                this.state = 'LIVE';
                this.updateNav('ON AIR', 'text-apple-red', 'bg-apple-red');

                const card = document.getElementById('workflow-card');
                card.innerHTML = `
                    <div class="flex flex-col items-center w-full fade-in">
                        <div class="flex items-center space-x-3 mb-6">
                            <div class="w-4 h-4 bg-apple-red rounded-full dot-pulse-red"></div>
                            <span class="text-apple-red font-bold type-caption tracking-widest text-xl">LIVE</span>
                        </div>

                        <div class="bg-[#2c2c2e] p-4 rounded-xl mb-2 w-56 h-28 flex items-center justify-center shadow-lg border border-subtle">
                            <img src="${this.targetStation.logo}" alt="Logo" class="max-h-full max-w-full object-contain" onerror="this.style.display='none'">
                        </div>
                        <p class="text-xs text-gray-500 mb-6">${this.targetStation.name} · ${this.targetStation.anstalt}</p>

                        <div class="text-6xl font-light tabular-nums mb-8 type-display" id="live-timer">02:00</div>

                        <div class="w-full h-16 flex items-end justify-center space-x-1" id="visualizer-container">
                            <canvas id="visualizer-canvas" width="280" height="64"></canvas>
                        </div>
                    </div>
                `;

                this.startVisualizer();

                this.startTimer(120,
                    (timeLeft) => {
                        document.getElementById('live-timer').textContent = this.formatTime(timeLeft);
                    },
                    () => {
                        this.playBeep(600, 150);
                        setTimeout(() => this.playBeep(600, 150), 250);

                        this.stopMicrophone();
                        this.renderStateStandby();
                    }
                );
            },

            // --- HELPERS ---
            startTimer(seconds, onTick, onComplete) {
                if (this.timerInterval) clearInterval(this.timerInterval);
                let timeLeft = seconds;

                this.timerInterval = setInterval(() => {
                    timeLeft--;
                    if (timeLeft >= 0) {
                        onTick(timeLeft);
                    } else {
                        clearInterval(this.timerInterval);
                        onComplete();
                    }
                }, 1000);
            },

            formatTime(seconds) {
                const m = Math.floor(seconds / 60).toString().padStart(2, '0');
                const s = (seconds % 60).toString().padStart(2, '0');
                return `${m}:${s}`;
            },

            startVisualizer() {
                const canvas = document.getElementById('visualizer-canvas');
                if (!canvas || !this.analyser) return;
                const ctx = canvas.getContext('2d');
                const bufferLength = 16;
                const dataArray = new Uint8Array(this.analyser.frequencyBinCount);

                const draw = () => {
                    if (this.state !== 'LIVE') return;
                    this.visualizerFrame = requestAnimationFrame(draw);
                    this.analyser.getByteFrequencyData(dataArray);

                    ctx.clearRect(0, 0, canvas.width, canvas.height);

                    const barWidth = (canvas.width / bufferLength) - 2;
                    let x = 0;

                    for (let i = 0; i < bufferLength; i++) {
                        const barHeight = (dataArray[i] / 255) * canvas.height;
                        ctx.fillStyle = '#ff453a';
                        ctx.beginPath();
                        ctx.roundRect(x, canvas.height - barHeight, barWidth, barHeight, 4);
                        ctx.fill();
                        x += barWidth + 2;
                    }
                };
                draw();
            },

            // --- SELECTION ---
            isSelected(name) {
                return !!this.selectedStation && this.selectedStation.name === name;
            },

            selectStation(name, anstalt, logo) {
                if (this.isSelected(name)) {
                    this.selectedStation = null;
                } else {
                    this.selectedStation = { name, anstalt, logo };
                    this.haptic(8);
                }
                this.renderDirectory();
                this.renderSelectionChip();
                if (this.state === 'STANDBY') this.renderStateStandby();
            },

            clearSelection() {
                this.selectedStation = null;
                this.renderDirectory();
                this.renderSelectionChip();
                if (this.state === 'STANDBY') this.renderStateStandby();
            },

            renderSelectionChip() {
                const chip = document.getElementById('selection-chip');
                if (this.selectedStation) {
                    chip.classList.remove('hidden');
                    chip.classList.add('flex');
                    chip.innerHTML = `
                        <span class="truncate max-w-[120px]">${this.selectedStation.name}</span>
                        <button onclick="App.clearSelection()" aria-label="Auswahl aufheben" class="press-sm w-4 h-4 rounded-full bg-apple-blue/25 flex items-center justify-center text-[10px] shrink-0">✕</button>
                    `;
                } else {
                    chip.classList.add('hidden');
                    chip.classList.remove('flex');
                    chip.innerHTML = '';
                }
            },

            // --- VIEW MODE / SORTING ---
            setupViewToggle() {
                const toggle = document.getElementById('view-toggle');
                toggle.querySelectorAll('button').forEach(btn => {
                    btn.addEventListener('click', () => {
                        this.viewMode = btn.dataset.mode;
                        toggle.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
                        this.renderDirectory();
                    });
                });
            },

            setupSearch() {
                const searchInput = document.getElementById('search-input');
                searchInput.addEventListener('input', (e) => {
                    this.searchTerm = e.target.value.trim().toLowerCase();
                    this.renderDirectory();
                });
            },

            getFilteredGrouped() {
                const term = this.searchTerm;
                if (!term) return appData.rundfunkanstalten;
                return appData.rundfunkanstalten
                    .map(a => ({ ...a, sender: a.sender.filter(s => s.name.toLowerCase().includes(term) || a.anstalt.toLowerCase().includes(term)) }))
                    .filter(a => a.sender.length > 0);
            },

            getFilteredFlat() {
                const term = this.searchTerm;
                if (!term) return this.flatSenderList;
                return this.flatSenderList.filter(s => s.name.toLowerCase().includes(term) || s.anstalt.toLowerCase().includes(term));
            },

            renderDirectory() {
                this.renderSelectionChip();
                const azIndex = document.getElementById('az-index');
                if (this.viewMode === 'az') {
                    azIndex.classList.add('visible');
                    this.renderAZ();
                } else {
                    azIndex.classList.remove('visible');
                    this.renderGrouped();
                }
            },

            stationItemHtml(sender, anstaltName, subtitle) {
                const selected = this.isSelected(sender.name);
                const safeName = sender.name.replace(/'/g, "\\'");
                const safeAnstalt = anstaltName.replace(/'/g, "\\'");
                return `
                    <div class="station-item press-sm flex items-center p-4 cursor-pointer hover:bg-white/5 transition-colors"
                         data-selected="${selected}"
                         onclick="App.selectStation('${safeName}', '${safeAnstalt}', '${sender.logo}')">
                        <div class="h-10 w-16 bg-[#2c2c2e] rounded flex items-center justify-center mr-4 shrink-0 overflow-hidden">
                            <img src="${sender.logo}" class="max-h-full max-w-full object-contain" onerror="this.style.display='none'">
                        </div>
                        <div class="min-w-0 flex-1">
                            <p class="text-base font-medium truncate">${sender.name}</p>
                            ${subtitle ? `<p class="text-xs text-gray-500 truncate">${subtitle}</p>` : ''}
                        </div>
                        <div class="w-6 h-6 rounded-full shrink-0 ml-2 flex items-center justify-center border ${selected ? 'bg-apple-blue border-apple-blue' : 'border-gray-600'}">
                            ${selected ? '<svg class="w-3.5 h-3.5 text-white check-pop" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"></path></svg>' : ''}
                        </div>
                    </div>
                `;
            },

            renderGrouped() {
                const list = document.getElementById('directory-list');
                const groups = this.getFilteredGrouped();

                if (groups.length === 0) {
                    list.innerHTML = this.emptyStateHtml();
                    return;
                }

                list.innerHTML = `<div class="px-4 space-y-6 pt-2">${groups.map(anstalt => `
                    <div class="station-group card-bg border border-subtle rounded-2xl overflow-hidden fade-in">
                        <div class="sticky-group-header bg-[#1c1c1e]/95 backdrop-blur px-4 py-3 flex items-center justify-between border-b border-subtle">
                            <div class="flex items-center gap-2 min-w-0">
                                <span class="font-semibold text-sm type-headline truncate">${anstalt.anstalt}</span>
                                <span class="text-[11px] text-gray-500 font-medium shrink-0">${anstalt.sender.length}</span>
                            </div>
                            <img src="${anstalt.anstalt_logo}" class="h-5 w-auto object-contain shrink-0 ml-2" onerror="this.style.display='none'">
                        </div>
                        <div class="divide-y divide-subtle">
                            ${anstalt.sender.map(s => this.stationItemHtml(s, anstalt.anstalt)).join('')}
                        </div>
                    </div>
                `).join('')}</div>`;
            },

            renderAZ() {
                const list = document.getElementById('directory-list');
                const flat = this.getFilteredFlat();

                if (flat.length === 0) {
                    list.innerHTML = this.emptyStateHtml();
                    document.getElementById('az-index').innerHTML = '';
                    return;
                }

                const byLetter = {};
                flat.forEach(s => {
                    const letter = (s.name.trim()[0] || '#').toUpperCase();
                    if (!byLetter[letter]) byLetter[letter] = [];
                    byLetter[letter].push(s);
                });
                const letters = Object.keys(byLetter).sort((a, b) => a.localeCompare(b, 'de'));

                list.innerHTML = `<div class="px-4 card-bg border border-subtle rounded-2xl overflow-hidden mt-2 fade-in">${letters.map(letter => `
                    <div id="az-letter-${letter}">
                        <div class="sticky-group-header bg-[#1c1c1e]/95 backdrop-blur px-4 py-1.5 border-b border-subtle">
                            <span class="text-xs font-bold text-apple-blue type-headline">${letter}</span>
                        </div>
                        <div class="divide-y divide-subtle">
                            ${byLetter[letter].map(s => this.stationItemHtml(s, s.anstalt, s.anstalt)).join('')}
                        </div>
                    </div>
                `).join('')}</div>`;

                const idx = document.getElementById('az-index');
                idx.innerHTML = letters.map(l => `<button class="press-sm" onclick="App.jumpToLetter('${l}')">${l}</button>`).join('');
            },

            jumpToLetter(letter) {
                const el = document.getElementById(`az-letter-${letter}`);
                if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
            },

            emptyStateHtml() {
                return `
                    <div class="px-4 pt-10 flex flex-col items-center text-center">
                        <span class="text-3xl mb-3">🔍</span>
                        <p class="text-sm font-medium text-gray-300">Keine Sender gefunden</p>
                        <p class="text-xs text-gray-500 mt-1">Versuche einen anderen Suchbegriff.</p>
                    </div>
                `;
            },

            // --- UI ALERTS ---
            showAlert() {
                const overlay = document.getElementById('alert-overlay');
                overlay.classList.remove('hidden');
                overlay.classList.add('flex');
                setTimeout(() => {
                    overlay.querySelector('.card-bg').classList.remove('scale-95');
                    overlay.querySelector('.card-bg').classList.add('scale-100');
                }, 10);
            },

            hideAlert() {
                const overlay = document.getElementById('alert-overlay');
                overlay.querySelector('.card-bg').classList.remove('scale-100');
                overlay.querySelector('.card-bg').classList.add('scale-95');
                setTimeout(() => {
                    overlay.classList.add('hidden');
                    overlay.classList.remove('flex');
                }, 200);
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            App.init();
        });
    </script>
</body>
</html>
