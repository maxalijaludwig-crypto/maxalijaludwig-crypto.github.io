<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B192C">
<title>BHRT Studio System</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{--navy:#0B192C;--blue:#003366;--gold:#FFCC00;--ink:#070f1b;--line:#1d3557}
  html,body{background:var(--ink);color:#e8eef7;font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
  .panel{background:var(--navy);border:1px solid var(--line);border-radius:10px;padding:14px}
  .btn{background:var(--blue);border:1px solid #1a4f8a;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;transition:background .15s}
  .btn:hover{background:#0a4a8c}.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .btn.gold{background:var(--gold);color:#0B192C;border-color:var(--gold)}.btn.gold:hover{background:#ffd93d}
  .btn.red{background:#b3001b;border-color:#e0002a}.btn.red:hover{background:#d4001f}
  .field{background:#06101f;border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;color:#fff}
  h2{font-weight:700;color:var(--gold);margin-bottom:10px}
  th{text-align:left;color:#8fa8c8;font-weight:600;padding:6px 8px}td{padding:8px}
  tr.act td{background:rgba(255,204,0,.14);color:#fff}tr.act td:first-child{box-shadow:inset 4px 0 var(--gold)}
  .scr{position:relative;overflow:hidden;height:100%}
  #pt-text{position:absolute;left:6%;right:6%;top:0;will-change:transform;font-weight:600;line-height:1.35}
  #pt-text p{margin:0 0 .7em}
  .cue{color:#06101f;background:var(--gold);padding:0 .4em;border-radius:6px;font-size:.7em;display:inline-block}
  .time{color:#6fb7ff;font-variant-numeric:tabular-nums}.note{color:#9aa9bd;font-style:italic;font-size:.8em}
  .stage{contain:layout paint;aspect-ratio:16/9;background:linear-gradient(135deg,#12294a,#050b14);border-radius:10px;position:relative;overflow:hidden;border:1px solid var(--line)}
  :root{--ease:cubic-bezier(.2,.8,.2,1)}
  /* ---- broadcast graphics: sized in container units so preview == program ---- */
  .gfx{position:absolute;inset:0;container-type:size;pointer-events:none;font-family:"Barlow Semi Condensed","Segoe UI",sans-serif}
  .lt{position:absolute;left:5cqw;bottom:12cqw;display:grid;grid-template-columns:.9cqw auto;opacity:0;transform:translateX(-6cqw);
      filter:drop-shadow(0 1cqw 2cqw rgba(0,0,0,.5));transition:transform .5s var(--ease),opacity .35s}
  .lt.in{opacity:1;transform:none}.lt.out{opacity:0;transform:translateX(-3cqw);transition-duration:.3s}
  .lt::before{content:"";background:linear-gradient(var(--gold),#ff9d00);transform:scaleY(0);transform-origin:bottom;transition:transform .45s var(--ease)}
  .lt.in::before{transform:none}
  .lt .card{padding:1.1cqw 2.6cqw 1.2cqw 1.8cqw;border-radius:0 .9cqw .9cqw 0;background:linear-gradient(100deg,rgba(7,15,27,.96),rgba(0,51,102,.94));
      clip-path:inset(0 100% 0 0);transition:clip-path .6s var(--ease) .1s}
  .lt.in .card{clip-path:inset(0)}
  .lt .name{font-weight:800;font-size:3.4cqw;line-height:1.05;color:#fff}
  .lt .role{font-weight:500;font-size:1.75cqw;line-height:1.25;margin-top:.45cqw;color:#cfe0f5}
  .lt .role.bs{color:var(--gold)}.lt .role:empty{display:none}
  .lt[data-lang=en] .bs,.lt[data-lang=bs] .en{display:none}
  .lt[data-lang=alt] .roles{display:grid}.lt[data-lang=alt] .role{grid-area:1/1;animation:swap 10s infinite}
  .lt[data-lang=alt] .role.bs{animation-delay:-5s}
  @keyframes swap{0%,42%{opacity:1}50%,92%{opacity:0}100%{opacity:1}}
  .tk{position:absolute;left:0;right:0;bottom:0;height:5.2cqw;display:flex;overflow:hidden;background:linear-gradient(90deg,#06101f,var(--navy));
      border-top:.25cqw solid var(--gold);transform:translateY(100%);transition:transform .4s var(--ease)}
  .tk.in{transform:none}
  .tk-label{background:var(--gold);color:var(--navy);font-weight:800;font-size:1.7cqw;padding:0 2cqw;display:grid;place-items:center}
  .tk-track{flex:1;overflow:hidden;display:flex;align-items:center}
  .tk-track span{display:inline-block;white-space:nowrap;padding-left:100%;color:#fff;font-weight:500;font-size:2cqw;animation:tk 22s linear infinite}
  @keyframes tk{to{transform:translateX(-100%)}}
  .tally{position:absolute;top:2%;left:2%;font:700 12px system-ui;padding:3px 8px;border-radius:5px;background:#475569;color:#fff}
  .tally[data-s=air]{background:#c1121f}
  /* ---- category chips (type of programme) ---- */
  .chip{display:inline-block;margin-left:.3em;padding:.1em .6em;border-radius:.5em;background:hsl(var(--h,45) 65% 38%);color:#fff;font-size:.75em;font-weight:700;white-space:nowrap}
  .chip.live{background:#c1121f}.chip.live::before{content:"";display:inline-block;width:.5em;height:.5em;margin-right:.4em;border-radius:50%;background:#fff;animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.3}}
  /* ---- full-screen schedule board (viewer + output), paged ---- */
  .board{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;gap:2vh;padding:4vh 5vw 3vh;container-type:size;color:#fff;
         background:radial-gradient(120% 90% at 0% 0%,#12294a,#050b14);font-family:"Barlow Semi Condensed","Segoe UI",sans-serif}
  .board.on{display:flex}
  .b-head{display:flex;align-items:center;gap:3cqmin;height:15cqh}
  .b-head img{height:100%;max-width:22cqw;object-fit:contain}
  .b-title{font-size:5.2cqmin;font-weight:800;color:var(--gold);line-height:1.05}.b-sub{font-size:2.6cqmin;color:#cfe0f5}
  .b-clock{margin-left:auto;text-align:right}#bclk{font-size:8cqmin;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}#bdate{font-size:2.4cqmin;color:#cfe0f5}
  .b-list{flex:1;min-height:0;display:grid;grid-template-rows:repeat(6,1fr);gap:1.2cqh}
  .b-list.flip{animation:bflip .45s var(--ease)}@keyframes bflip{from{opacity:0;transform:translateY(2cqh)}to{opacity:1;transform:none}}
  .b-row{display:grid;grid-template-columns:15cqmin 1fr auto;align-items:center;gap:3cqmin;padding:0 3cqmin;min-height:0;overflow:hidden;
         border-radius:1.4cqmin;border-left:1cqmin solid transparent;background:rgba(255,255,255,.06)}
  .b-row.act{background:var(--gold);color:var(--navy);border-left-color:#fff}.b-row.past{opacity:.45}
  .b-time{font-size:4.6cqmin;font-weight:800;font-variant-numeric:tabular-nums}
  .b-main{min-width:0}.b-t{font-size:3.8cqmin;font-weight:800;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .b-s{font-size:2.2cqmin;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .b-chips{display:flex;gap:1cqmin;justify-content:flex-end}.board .chip{font-size:2cqmin;margin:0}
  .b-foot{height:4cqh;display:flex;align-items:center;justify-content:center;gap:1.2cqmin;font-size:2cqmin;color:#9aa9bd}
  .b-foot i{width:1.6cqmin;height:1.6cqmin;border-radius:50%;background:#33507a}.b-foot i.on{background:var(--gold)}
  /* ---- intro layer ---- */
  .intro{position:fixed;inset:0;z-index:30;background:#000;display:none}.intro.on{display:block}
  .intro video{width:100%;height:100%;object-fit:cover}
  .intro.sting video{display:none}
  .intro.sting::after{content:"";position:absolute;inset:0;background:var(--logo) center/28% no-repeat,linear-gradient(120deg,#050b14,#0B192C);animation:sting 4s var(--ease) both}
  @keyframes sting{from{opacity:0;transform:scale(.92)}20%,85%{opacity:1;transform:none}to{opacity:0}}
  /* ===== v2: iPad / touch, polish ===== */
  html{-webkit-text-size-adjust:100%}
  body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
  @supports (height:100dvh){.h-screen{height:100dvh}.min-h-screen{min-height:100dvh}}
  .safe-t{padding-top:max(.5rem,env(safe-area-inset-top))}
  .panel{background:linear-gradient(180deg,#0e2036,#0B192C);box-shadow:0 8px 24px -14px rgba(0,0,0,.7)}
  h2{font-size:.78rem;letter-spacing:.09em;text-transform:uppercase}
  .btn{user-select:none;-webkit-user-select:none;touch-action:manipulation}.btn:active{transform:scale(.97)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  @media (pointer:coarse){.btn{min-height:44px}.field{min-height:44px;font-size:16px}input[type=range]{height:32px}}
  ::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#24446e;border-radius:6px}::-webkit-scrollbar-track{background:transparent}
  .pill{display:inline-flex;align-items:center;gap:.4em;padding:.15em .7em;border-radius:999px;font-weight:700;font-size:.8rem;background:#1d3557;color:#cfe0f5;white-space:nowrap}
  .pill.red{background:#c1121f;color:#fff}.pill.gold{background:var(--gold);color:var(--navy)}.pill.green{background:#13795b;color:#fff}
  .fdot{width:.7em;height:.7em;border-radius:50%;background:#fff;animation:pulse 1s ease-in-out infinite;display:inline-block}
  /* ---- fullscreen "show starts" countdown (output) ---- */
  .cd{position:fixed;inset:0;z-index:25;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4vh 4vw;color:#fff;
      background:radial-gradient(120% 90% at 50% 0%,#12294a,#050b14);font-family:"Barlow Semi Condensed","Segoe UI",sans-serif}
  .cd.on{display:flex}
  .cd img{height:11vh;margin-bottom:4vh}.cd .bar{width:12vw;height:.8vh;background:var(--gold);margin-bottom:4vh}
  .cd h1{margin:0;font-size:6.5vh;font-weight:800;color:var(--gold);line-height:1.05}
  .cd p{font-size:3vh;margin:1vh 0 0;max-width:70vw;color:#e8eef7}.cd .bsb{margin-top:4vh}
  .cd .big{font-size:22vh;font-weight:800;line-height:1;margin-top:4vh;font-variant-numeric:tabular-nums;letter-spacing:.02em}
  .cd .at{margin-top:2vh;font-size:3.4vh;color:#cfe0f5}.cd.live .big{color:#3ddc97}
  /* ---- video bank (several clips at once, output) ---- */
  .vb{position:fixed;inset:0;z-index:22;display:none;gap:.5vmin;background:#000}.vb.on{display:grid}
  .vbv{width:100%;height:100%;min-width:0;min-height:0;object-fit:contain;background:#000;display:none}
  /* ---- recording preview ---- */
  .rcbox{position:absolute;z-index:15;right:12px;top:16px;width:min(28%,220px);aspect-ratio:16/9;border-radius:10px;overflow:hidden;border:2px solid #475569;background:#000;box-shadow:0 8px 24px rgba(0,0,0,.6)}
  .rcbox.rcin{position:relative;right:auto;top:auto;width:100%;max-width:280px;margin-top:8px}
  .rcbox.rec{border-color:#e0002a}.rcbox video{width:100%;height:100%;object-fit:cover}.rcbox video.mir{transform:scaleX(-1)}
  .rcbox .rt{position:absolute;left:6px;top:6px;font:700 11px system-ui;background:#c1121f;color:#fff;border-radius:4px;padding:1px 6px;display:none}.rcbox.rec .rt{display:block}
  /* ---- prompter ---- */
  #ptmirror.mir{transform:scaleX(-1)}
  .pt-band{position:absolute;left:0;right:0;top:38%;height:0;z-index:5;pointer-events:none}
  .pt-band::before{content:"";position:absolute;left:0;right:0;top:-1px;height:2px;background:rgba(255,204,0,.45)}
  .pt-band i{position:absolute;top:-13px;border:13px solid transparent}.pt-band i.l{left:0;border-left-color:var(--gold)}.pt-band i.r{right:0;border-right-color:var(--gold)}
  .pt-fade{position:absolute;left:0;right:0;height:20%;z-index:4;pointer-events:none}
  .pt-fade.t{top:0;background:linear-gradient(#000,transparent)}.pt-fade.b{bottom:0;background:linear-gradient(transparent,#000)}
  .ptprog{position:absolute;left:0;right:0;top:0;height:5px;background:#12294a;z-index:19}.ptprog i{display:block;height:100%;width:0;background:var(--gold)}
  .ptctl{position:absolute;z-index:18;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;
      padding:10px 12px;border-radius:16px;background:rgba(7,15,27,.9);border:1px solid var(--line);backdrop-filter:blur(8px);transition:opacity .3s,transform .3s;max-width:96%}
  .ptctl.hid{opacity:0;pointer-events:none;transform:translate(-50%,20px)}
  .ptctl .btn{min-width:48px;min-height:48px;font-size:1.05rem}
  .ptctl .grp{display:flex;align-items:center;gap:6px;padding-left:8px;border-left:1px solid var(--line)}.ptctl .grp:first-child{border:0;padding:0}
  .ptctl .val{min-width:3.2ch;text-align:center;font-variant-numeric:tabular-nums;font-weight:700}
  /* ---- song layer ("now playing"), independent of lower third + ticker ---- */
  .sg{position:absolute;left:5cqw;top:5cqw;display:flex;align-items:stretch;opacity:0;transform:translateY(-3cqw);max-width:70cqw;
      filter:drop-shadow(0 1cqw 2cqw rgba(0,0,0,.5));transition:transform .5s var(--ease),opacity .35s}
  .sg.in{opacity:1;transform:none}.sg.out{opacity:0;transform:translateY(-2cqw);transition-duration:.3s}
  .sg-eq{width:6cqw;display:flex;align-items:flex-end;justify-content:center;gap:.5cqw;padding:1.3cqw;background:var(--gold);border-radius:.9cqw 0 0 .9cqw}
  .sg-eq i{width:.9cqw;background:var(--navy);border-radius:.2cqw;height:30%;animation:eq 1s ease-in-out infinite}
  .sg-eq i:nth-child(2){animation-delay:-.3s}.sg-eq i:nth-child(3){animation-delay:-.6s}.sg-eq i:nth-child(4){animation-delay:-.15s}
  @keyframes eq{0%,100%{height:25%}50%{height:100%}}
  .sg-t{padding:1.1cqw 2.6cqw 1.2cqw 1.8cqw;background:linear-gradient(100deg,rgba(7,15,27,.96),rgba(0,51,102,.94));border-radius:0 .9cqw .9cqw 0;min-width:0}
  .sg-k{font-weight:800;font-size:1.2cqw;letter-spacing:.15em;color:var(--gold)}
  .sg-title{font-weight:800;font-size:3.2cqw;line-height:1.05;color:#fff}
  .sg-artist{font-weight:500;font-size:2cqw;color:#cfe0f5;margin-top:.3cqw}.sg-meta{font-size:1.5cqw;color:#9aa9bd}
  .sg-artist:empty,.sg-meta:empty{display:none}
</style>
</head>
<body class="min-h-screen">
<div id="app"></div>
<button id="reset" style="top:max(8px,env(safe-area-inset-top))" class="fixed right-2 z-50 text-xs bg-black/50 border border-slate-600 rounded px-2 py-1 hover:border-yellow-400">Reset role</button>
<div id="toast" class="fixed bottom-3 left-3 z-50 text-xs bg-black/70 rounded px-3 py-1 hidden"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, set, update, onDisconnect, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* ===== FIREBASE CONFIG — replace with your own project values if needed ===== */
const firebaseConfig = {
  apiKey: "AIzaSyBu9VM10UM5IhUOk-zAf-F5XrG55nrfSsk",
  authDomain: "bewerbungen-60a63.firebaseapp.com",
  databaseURL: "https://bewerbungen-60a63-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "bewerbungen-60a63",
  storageBucket: "bewerbungen-60a63.firebasestorage.app",
  messagingSenderId: "21188826929",
  appId: "1:21188826929:web:3f33e9270b159226d80210",
  measurementId: "G-JC01Z55TRB"
};
/* ========================================================================== */

const LOGO = "https://upload.wikimedia.org/wikipedia/commons/d/d6/Logo_of_BHRT_%281998-%29.svg";
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const toast = m => { const t = $("#toast"); t.textContent = m; t.classList.remove("hidden"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.add("hidden"), 2800); };

/* ---------- Role ---------- */
const params = new URLSearchParams(location.search);
let role = params.get("role") || localStorage.getItem("bhrt-role");
if (!["control", "studio", "prompter", "viewer", "output"].includes(role)) role = null;
$("#reset").onclick = () => { localStorage.removeItem("bhrt-role"); location.href = location.pathname; };

/* ---------- State & Firebase ---------- */
let st = { schedule: [], overlays: [], hosts: [], tickers: [], actions: [], viz: "bars", viewerMsg: "", show: {}, fault: false, faultMsg: {}, active: -1, script: "", pr: { playing: false, speed: 40, size: 56, anchor: 0, at: 0 }, ov: { live: null, staged: null, onAir: false, ticker: "", tickerOn: false, lang: "both" }, intro: null, faultId: "", faultAt: 0, sb: {}, start: {}, clips: [], vp: {}, rec: {}, songs: [], sg: {}, activeAt: 0 };
let off = 0, db = null, onState = () => {};
const now = () => Date.now() + off;
const arr = v => Array.isArray(v) ? v.filter(Boolean) : (v ? Object.values(v) : []);
const put = (path, val) => db && set(ref(db, "studio/" + path), val).catch(e => toast("Write failed: " + e.message));
const AUTO_OFF = 30000;                          // lower third and ticker leave the air automatically after 30 s
const patch = (path, obj) => {
  if (path === "ov") { obj = { ...obj }; if (obj.onAir) obj.at = now(); if (obj.tickerOn) obj.tickerAt = now(); }   // stamp every take with server time
  return db && update(ref(db, "studio/" + path), obj).catch(e => toast("Write failed: " + e.message));
};
const AUTO_SG = 20000;                          // song card leaves automatically after 20 s unless "hold" is set
const sgView = () => { const o = st.sg || {}; return { onAir: !!o.onAir && (!!o.hold || now() - (o.at || 0) < AUTO_SG), live: o.live, staged: o.staged }; };
const ovView = () => { const o = st.ov, n = now(); return { ...o, onAir: !!o.onAir && n - (o.at || 0) < AUTO_OFF, tickerOn: !!o.tickerOn && n - (o.tickerAt || 0) < AUTO_OFF }; };

try {
  db = getDatabase(initializeApp(firebaseConfig));
  onValue(ref(db, ".info/serverTimeOffset"), s => off = s.val() || 0);
  onValue(ref(db, "studioAudio"), s => { const v = s.val(); if (v && v.b && !mic.on && performance.now() - bcAt > 500) setBands(Uint8Array.from(atob(v.b), c => c.charCodeAt(0))); });
  onValue(ref(db, "studio"), s => {
    const v = s.val() || {};
    st = { ...st, ...v, schedule: arr(v.schedule), overlays: arr(v.overlays), hosts: arr(v.hosts), tickers: arr(v.tickers), actions: arr(v.actions), viz: v.viz || "bars", viewerMsg: v.viewerMsg || "", show: v.show || {}, fault: !!v.fault, faultMsg: v.faultMsg || {}, script: v.script || "", pr: { ...st.pr, ...(v.pr || {}) }, ov: { live: null, staged: null, onAir: false, ticker: "", tickerOn: false, lang: "both", ...(v.ov || {}) }, intro: v.intro || null, sb: v.sb || {}, active: v.active ?? -1, start: v.start || {}, clips: arr(v.clips), vp: v.vp || {}, rec: v.rec || {}, songs: arr(v.songs), sg: v.sg || {}, activeAt: v.activeAt || 0 };
    faultUpdate();                                   // fault first: a page render error must never block it
    try { introUpdate(); boardUpdate(); cdUpdate(); vbankUpdate(); onState(); } catch (err) { console.error(err); }
  }, e => toast("Database error: " + e.message));
} catch (e) { toast("Firebase init failed: " + e.message); }

/* ---------- Shared pieces ---------- */
const header = (sub) => `<header class="flex items-center gap-4 px-4 py-3 border-b border-[#1d3557] bg-[#0B192C]"><img src="${LOGO}" alt="BHRT" class="h-10 sm:h-12"><div class="font-bold text-lg">${sub}</div><div id="conn" class="ml-auto mr-20 text-xs text-slate-400"></div></header>`;
const GFX_HTML = `<div class="lt"><div class="card"><div class="name"></div><div class="roles"><div class="role en" lang="en"></div><div class="role bs" lang="bs"></div></div></div></div>
  <div class="tk"><div class="tk-label">BHRT</div><div class="tk-track"><span></span></div></div>
  <div class="sg"><div class="sg-eq"><i></i><i></i><i></i><i></i></div><div class="sg-t"><div class="sg-k">♪ NOW PLAYING · SADA SE SVIRA</div><div class="sg-title"></div><div class="sg-artist"></div><div class="sg-meta"></div></div></div>`;
/* Idempotent: call on every state change. Keeps its DOM nodes so graphics can animate in AND out. */
function gfx(root, s) {                       // s = { live, onAir, lang, ticker, tickerOn }
  root.classList.add("gfx"); if (!root.firstChild) root.innerHTML = GFX_HTML;
  const lt = $(".lt", root), tk = $(".tk", root), o = s.onAir ? s.live : null, key = o ? [o.title, o.subtitle, o.subtitle_bs].join("|") : "";
  lt.dataset.lang = s.lang || "both";
  if (root._key !== key) {
    root._key = key; clearTimeout(root._t);
    const show = () => { $(".name", lt).textContent = o.title; $(".en", lt).textContent = o.subtitle || ""; $(".bs", lt).textContent = o.subtitle_bs || ""; lt.classList.remove("out"); lt.classList.add("in"); };
    if (lt.classList.contains("in")) { lt.classList.replace("in", "out"); if (o) root._t = setTimeout(show, 350); }

/* ---------- Microphone: 64 log-spaced bands (40 Hz–16 kHz), 25 Hz, to all screens ---------- */
const mic = { on: false };
const NB = 64, bcA = new BroadcastChannel("bhrt-audio");
bcA.onmessage = e => { bcAt = performance.now(); setBands(e.data); };       // same-PC windows: no network hop
const pubBands = u8 => { bcA.postMessage(u8); db && set(ref(db, "studioAudio"), { b: btoa(String.fromCharCode(...u8)), t: now() }).catch(() => { }); };
const micToggle = async dev => {
  if (mic.on) { mic.s.getTracks().forEach(t => t.stop()); mic.ctx.close(); clearInterval(mic.iv); mic.on = false; const z = new Uint8Array(NB); setBands(z); return pubBands(z); }
  mic.s = await navigator.mediaDevices.getUserMedia({ audio: { deviceId: dev ? { exact: dev } : undefined, echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 2 } });
  mic.ctx = new AudioContext({ latencyHint: "interactive" });
  const an = mic.ctx.createAnalyser(); an.fftSize = 4096; an.smoothingTimeConstant = .6; an.minDecibels = -90; an.maxDecibels = -10;
  mic.ctx.createMediaStreamSource(mic.s).connect(an);
  const f = new Uint8Array(an.frequencyBinCount), u8 = new Uint8Array(NB);
  const edges = Array.from({ length: NB + 1 }, (_, i) => 40 * Math.pow(16000 / 40, i / NB));
  const bin = hz => Math.min(f.length - 1, Math.round(hz / (mic.ctx.sampleRate / 2) * (f.length - 1)));
  mic.on = true;
  mic.iv = setInterval(() => {
    an.getByteFrequencyData(f);
    for (let i = 0; i < NB; i++) { const a = bin(edges[i]), b = Math.max(bin(edges[i + 1]), a + 1); let sum = 0; for (let k = a; k < b; k++) sum += f[k]; u8[i] = sum / (b - a); }
    setBands(u8); pubBands(u8);
  }, 40);
};
/* Spatial bus for any stream played in the page: HRTF panner + small room + limiter. Tap the analyser BEFORE this chain. */
const roomIR = (ctx, sec = 1.2, decay = 2.5) => { const n = ctx.sampleRate * sec, b = ctx.createBuffer(2, n, ctx.sampleRate);
  for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, decay); } return b; };
window.spatialBus = (ctx, src, { az = 0, dist = 2 } = {}) => {
  const hp = new BiquadFilterNode(ctx, { type: "highpass", frequency: 60 });
  const comp = new DynamicsCompressorNode(ctx, { threshold: -18, knee: 12, ratio: 3, attack: .01, release: .2 });
  const pan = new PannerNode(ctx, { panningModel: "HRTF", distanceModel: "inverse", refDistance: 1, rolloffFactor: .8, positionX: Math.sin(az) * dist, positionZ: -Math.cos(az) * dist });
  const wet = new ConvolverNode(ctx, { buffer: roomIR(ctx) }), wg = new GainNode(ctx, { gain: .18 });
  const lim = new DynamicsCompressorNode(ctx, { threshold: -1.5, knee: 0, ratio: 20, attack: .002, release: .08 });
  src.connect(hp).connect(comp).connect(pan); pan.connect(lim); pan.connect(wet).connect(wg).connect(lim); lim.connect(ctx.destination);
  return { move: (a, d = dist) => { pan.positionX.setTargetAtTime(Math.sin(a) * d, ctx.currentTime, .05); pan.positionZ.setTargetAtTime(-Math.cos(a) * d, ctx.currentTime, .05); } };
};

    }
    if (st.active !== lastA) { lastA = st.active; const el = $("#sl .act"), sl = $("#sl"); if (el) sl.scrollTo({ top: Math.max(0, el.offsetTop - sl.clientHeight * .3), behavior: "smooth" }); }
  };
  onState();
}

/* ---------- Screen 3: Prompter ---------- */
function prompter() {
  const mir = localStorage.getItem("bhrt-mirror") === "1";
  $("#app").innerHTML = `<div class="h-screen flex flex-col" id="ptroot">
    <header class="flex items-center gap-3 px-3 pb-2 safe-t border-b border-[#1d3557] bg-[#0B192C]">
      <img src="${LOGO}" alt="BHRT" class="h-8"><div class="font-bold">Prompter</div><span id="ptrem" class="pill hidden"></span><span id="ptsd" class="pill gold hidden"></span><span id="ptrec" class="pill red hidden"><i class="fdot"></i>REC <span id="ptrect"></span></span>
      <div class="ml-auto mr-20 flex items-center gap-2"><span id="conn" class="text-xs text-slate-400"></span>
        <button id="ptmir" class="btn py-1 text-sm">⇋ Mirror</button><button id="ptsb" class="btn py-1 text-sm">Panel</button><button id="fsb" class="btn py-1 text-sm">⛶</button></div>
    </header>
    <div class="flex-1 min-h-0 flex relative">
      <div class="flex-1 min-w-0 relative bg-black" id="ptstage">
        <div class="ptprog"><i id="ptpr"></i></div>
        <div id="ptmirror" class="absolute inset-0 ${mir ? "mir" : ""}"><div class="scr bg-black" id="pt" style="touch-action:none"><div class="pt-fade t"></div><div class="pt-fade b"></div><div class="pt-band"><i class="l"></i><i class="r"></i></div><div id="pt-text"></div></div></div>
        <div id="rcbox" class="rcbox hidden"><video id="rcpv" playsinline muted autoplay></video><span class="rt">● REC <b id="rcpt"></b></span></div>
        <div id="ptctl" class="ptctl">
          <div class="grp"><button class="btn" id="ptt" title="Top">⏮</button><button class="btn" id="ptjb" title="Back">⏪</button><button class="btn gold" id="ptplay" style="min-width:96px">▶ Play</button><button class="btn" id="ptjf" title="Forward">⏩</button></div>
          <div class="grp"><button class="btn" id="spm">−</button><span class="val" id="spv2"></span><button class="btn" id="spp">+</button><span class="text-xs text-slate-400">speed</span></div>
          <div class="grp"><button class="btn" id="fzm">A−</button><span class="val" id="fzv2"></span><button class="btn" id="fzp">A+</button></div>
          <div class="grp"><button class="btn gold rc-btn">● Record</button></div>
        </div>
      </div>
      <aside id="ptside" class="absolute lg:static right-0 top-0 bottom-0 z-20 w-[340px] shrink-0 p-3 border-l border-[#1d3557] bg-[#0B192C] overflow-y-auto${innerWidth < 1100 ? " hidden" : ""}">
        <h2>Preview</h2>${previewBox("pv")}<h2 class="mt-4">Audio levels</h2><canvas id="lvl" class="w-full rounded bg-[#06101f]" style="height:64px"></canvas>
        <h2 class="mt-4">Show</h2><div id="nx" class="text-sm text-slate-300"></div>
        <h2 class="mt-4">Record video</h2>${recHTML}</aside>
    </div></div>`;
  const body = $("#pt-text"), pt = $("#pt"), ctl = $("#ptctl"), prog = $("#ptpr");
  let lastScript = null, wasPlaying = null, H = 0, boxH = 0, hideT = 0, lastRem = 0;
  const measure = () => { H = body.offsetHeight; boxH = pt.clientHeight; };
  new ResizeObserver(measure).observe(pt); new ResizeObserver(measure).observe(body);
  const fmt = l => {
    const t = l.trim(); if (!t) return "";
    if (/^\[.*\]$/.test(t)) return `<p><span class="cue">${esc(t.slice(1, -1))}</span></p>`;
    if (/^\(.*\)$/.test(t)) return `<p class="note">${esc(t)}</p>`;
    return `<p>${esc(t).replace(/^(\d{1,2}[:.]\d{2})/, '<span class="time">$1</span>')}</p>`;
  };
  const prUpd = o => patch("pr", { anchor: prPos(), at: now(), ...o });
  const showCtl = () => { ctl.classList.remove("hid"); clearTimeout(hideT); if (st.pr.playing) hideT = setTimeout(() => ctl.classList.add("hid"), 5000); };
  /* manual scrolling: drag (finger/mouse) or wheel; position is shared, so every prompter + the control preview follow */
  let ovr = null, drag = null, lastSend = 0, wt = 0;
  const maxPos = () => Math.max(1, H - 80), clampP = v => Math.min(Math.max(v, 0), maxPos());
  const sendPos = (pos, force) => { const t = performance.now(); if (force || t - lastSend > 60) { lastSend = t; patch("pr", { anchor: pos, at: now() }); } };
  pt.addEventListener("pointerdown", e => { drag = { y: e.clientY, p0: clampP(prPos()), moved: false }; try { pt.setPointerCapture(e.pointerId); } catch { } });
  pt.addEventListener("pointermove", e => {
    if (!drag) return; const dy = e.clientY - drag.y; if (!drag.moved && Math.abs(dy) < 6) return;
    drag.moved = true; ovr = clampP(drag.p0 - dy); sendPos(ovr); showCtl();
  });
  const endDrag = e => {
    if (!drag) return; const d = drag; drag = null;
    if (d.moved && e.type !== "pointercancel") { sendPos(ovr, true); ovr = null; }
    else if (d.moved) ovr = null;
    else ctl.classList.contains("hid") ? showCtl() : ctl.classList.add("hid");   // plain tap: show/hide controls
  };
  pt.addEventListener("pointerup", endDrag); pt.addEventListener("pointercancel", endDrag);
  pt.addEventListener("wheel", e => {
    e.preventDefault(); ovr = clampP((ovr ?? prPos()) + e.deltaY * (e.deltaMode === 1 ? 20 : 1)); sendPos(ovr);
    clearTimeout(wt); wt = setTimeout(() => { sendPos(ovr, true); ovr = null; }, 150);
  }, { passive: false });
  ctl.addEventListener("pointerdown", showCtl);
  $("#ptplay").onclick = () => prUpd({ playing: !st.pr.playing });
  $("#ptt").onclick = () => patch("pr", { anchor: 0, at: now() });
  $("#ptjb").onclick = () => patch("pr", { anchor: Math.max(0, prPos() - 300), at: now() });
  $("#ptjf").onclick = () => patch("pr", { anchor: prPos() + 300, at: now() });
  $("#spm").onclick = () => prUpd({ speed: Math.max(0, st.pr.speed - 5) }); $("#spp").onclick = () => prUpd({ speed: Math.min(200, st.pr.speed + 5) });
  $("#fzm").onclick = () => patch("pr", { size: Math.max(28, st.pr.size - 4) }); $("#fzp").onclick = () => patch("pr", { size: Math.min(120, st.pr.size + 4) });
  $("#ptmir").onclick = () => { const m = $("#ptmirror").classList.toggle("mir"); localStorage.setItem("bhrt-mirror", m ? "1" : "0"); };
  $("#ptsb").onclick = () => $("#ptside").classList.toggle("hidden");
  document.addEventListener("keydown", e => {
    if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    if (e.code === "Space") { e.preventDefault(); $("#ptplay").click(); }
    else if (e.key === "PageDown") { e.preventDefault(); $("#ptjf").click(); } else if (e.key === "PageUp") { e.preventDefault(); $("#ptjb").click(); }
    else if (e.key === "ArrowUp") $("#spp").click(); else if (e.key === "ArrowDown") $("#spm").click(); else if (e.key === "Home") $("#ptt").click();
  });
  const loop = () => {
    if (!$("#pt")) return;
    const max = Math.max(1, H - 80), raw = ovr ?? prPos(), p = Math.min(Math.max(raw, 0), max);
    body.style.transform = `translate3d(0,${boxH * .38 - p}px,0)`; prog.style.width = (p / max * 100).toFixed(1) + "%";
    const t = performance.now();
    if (t - lastRem > 300) {
      lastRem = t; const r = $("#ptrem"), rem = st.pr.speed > 0 ? (max - p) / st.pr.speed * 1000 : 0;
      r.classList.toggle("hidden", !st.script || st.pr.speed <= 0); r.textContent = "−" + fmtEl(rem);
      const ss = SS(), pd = $("#ptsd"); pd.classList.toggle("hidden", !(ss && ss.left > -30000)); if (ss) pd.textContent = ss.left <= 0 ? "LIVE" : "start " + fmtCd(ss.left);
      const rc = $("#ptrec"); rc.classList.toggle("hidden", !REC.on); if (REC.on) $("#ptrect").textContent = fmtEl(Date.now() - REC.t0);
    }
    requestAnimationFrame(loop);
  };
  onState = () => {
    $("#conn").textContent = db ? "Synced" : "Offline";
    body.style.fontSize = st.pr.size + "px";
    if (st.script !== lastScript) { lastScript = st.script; body.innerHTML = st.script ? st.script.split("\n").map(fmt).join("") : `<p class="note">Waiting for a script from the control room.</p>`; }
    measure(); drawPreview("pv");
    $("#ptplay").textContent = st.pr.playing ? "⏸ Pause" : "▶ Play"; $("#spv2").textContent = st.pr.speed; $("#fzv2").textContent = st.pr.size;
    if (st.pr.playing !== wasPlaying) { wasPlaying = st.pr.playing; showCtl(); } if (!st.pr.playing) { clearTimeout(hideT); ctl.classList.remove("hid"); }
    const a = st.schedule[st.active], n = st.schedule[st.active + 1];
    $("#nx").innerHTML = `<div>Now: <b class="text-[#FFCC00]">${a ? esc(a.time + " " + a.title) : "–"}</b></div><div>Next: ${n ? esc(n.time + " " + n.title) : "–"}</div>`;
  };
  mountMeter("lvl"); recMount(); fsInit(); wake(); onState(); loop();
}

function viewer() {
  $("#reset").classList.add("hidden");
  $("#app").innerHTML = header("Programme") + `<main class="max-w-2xl mx-auto p-4 grid gap-4"><div><h1 id="vt" class="text-2xl sm:text-3xl font-bold"></h1><div id="vm" class="text-slate-300 mt-1"></div></div><div id="vnow" class="panel"></div><div id="vl" class="grid gap-2"></div></main>`;
  let last = -2;
  onState = () => {
    $("#conn").textContent = db ? "Live" : "Offline";
    $("#vt").textContent = (st.show.title || "Schedule") + (st.show.title_bs ? " / " + st.show.title_bs : ""); $("#vm").textContent = st.viewerMsg;
    const a = st.schedule[st.active], n = st.schedule[st.active + 1];
    $("#vnow").innerHTML = a ? `<div class="text-sm text-slate-400">On now / Trenutno: item ${st.active + 1} of ${st.schedule.length}</div><div class="text-2xl font-bold text-[#FFCC00]">${esc(a.time)} ${esc(a.title)}</div>${a.title_bs ? `<div class="text-lg text-[#FFCC00]/80">${esc(a.title_bs)}</div>` : ""}<div class="text-slate-300">${esc(a.details)}</div>${n ? `<div class="mt-2 text-sm text-slate-400">Next / Slijedi: ${esc(n.time)} ${esc(n.title)}</div>` : ""}` : `<div class="text-slate-300">The programme starts soon. / Program uskoro počinje.</div>`;
    $("#vl").innerHTML = st.schedule.map((r, i) => `<div id="v${i}" class="flex gap-3 items-baseline rounded-lg px-3 py-3 ${i === st.active ? "bg-[#FFCC00] text-[#0B192C] font-bold" : i < st.active ? "opacity-40 line-through" : "bg-[#0B192C] border border-[#1d3557]"}"><span class="tabular-nums">${esc(r.time)}</span><span class="flex-1">${esc(r.title)}${r.title_bs ? `<span class="block text-sm font-normal opacity-75">${esc(r.title_bs)}</span>` : ""}</span><span class="text-sm opacity-70">${esc(r.details)}</span></div>`).join("");
    if (st.active !== last) { last = st.active; const el = $("#v" + st.active); el && el.scrollIntoView({ block: "center", behavior: matchMedia("(prefers-reduced-motion:reduce)").matches ? "auto" : "smooth" }); }
  };
  onState();
}

/* Clean program feed for OBS / vMix: transparent background, graphics + intro only (fault still overrides everything) */
function output() {
  document.documentElement.style.background = document.body.style.background = "transparent";
  $("#reset").classList.add("hidden"); $("#toast").style.display = "none";
  $("#app").innerHTML = '<div id="pgm" style="position:fixed;inset:0;z-index:24;pointer-events:none"></div>';
  const draw = () => gfx($("#pgm"), { ...ovView(), song: sgView() }); onState = draw; draw(); setInterval(draw, 500);
}
({ control, studio, prompter, viewer, output }[role] || landing)();
</script>
</body>
