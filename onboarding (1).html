function render(go){const st=STEPS[n];LISTS.forEach(k=>D[k]=Object.values(D[k]||[]).filter(x=>x!=null));
 STEPS[n].x?.forEach(s=>{if(s.l&&!D[s.k].length)D[s.k]=[{}];if(s.st&&s.k&&!s.c&&!D[s.k].length)D[s.k]=[""]});
 $("#S").innerHTML=`<div class="step" ${go?`style="--d:${dir}"`:""}>${st.hero?`<div class="hero"><img src="${LOGO}" alt="BHRT" onerror="this.parentNode.remove()"></div>`:""}<h1 tabindex="-1">${st.t}</h1><p class="lead">${st.s}</p>${st.x?st.x.map(sec).join(""):review()}</div>`;
 $("#stepbtn").innerHTML=`Schritt ${n+1}<small>von ${N}</small>`;const p=Math.round((n+1)/N*100),b=$(".prog");b.setAttribute("aria-valuenow",p);$("i",b).style.width=p+"%";
 $("#back").disabled=!n;$("#next").style.display=n==N-1?"none":"";$("#skip").hidden=!(st.o&&!done(n)&&n<N-1);
 $("#next").textContent=n==N-2?"Zur Übersicht":"Weiter";if(go){scrollTo({top:0});$("h1").focus({preventScroll:true})}}
const go=i=>{dir=i>=n?1:-1;n=Math.max(0,Math.min(i,N-1));keep();render(1)};

const toast=(m,u)=>{const t=$("#toast");t.innerHTML=esc(m)+(u?"<button>Rückgängig</button>":"");t.classList.add("on");if(u)$("button",t).onclick=()=>{u();t.classList.remove("on")};clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("on"),u?6000:2400)};
const snap=()=>{const j=JSON.stringify(D);undo=()=>{D=JSON.parse(j);render()}};
let dt;const keep=()=>{clearTimeout(dt);dt=setTimeout(()=>{localStorage.setItem("bhrt-onb",JSON.stringify({D,n}));$("#save").textContent="Gesichert";setTimeout(()=>$("#save").textContent="",1800);$("#skip").hidden=!(STEPS[n].o&&!done(n)&&n<N-1)},300)};
$("#S").addEventListener("input",e=>{const t=e.target,p=t.dataset.p;if(!p)return;setv(p,t.type==="checkbox"?t.checked:t.type==="number"?(t.value===""?"":+t.value):t.value);keep()});
$("#next").onclick=()=>go(n+1);$("#skip").onclick=()=>go(n+1);$("#back").onclick=()=>go(n-1);
$("#stepbtn").onclick=()=>{const d=$("#dlg");d.innerHTML=`<h2>Alle Schritte</h2><div class="grp">${STEPS.map((s,i)=>`<div class="r"><button data-go="${i}" ${i==n?'aria-current="step"':""}>${i+1}. ${s.t}${done(i)?'<span class="ck">✓</span>':""}</button></div>`).join("")}</div>`;d.showModal()};
$("#dlg").addEventListener("click",e=>{const g=e.target.closest("[data-go]");if(g){$("#dlg").close();go(+g.dataset.go)}else if(e.target.id==="dlg")$("#dlg").close()});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.matches("#S input:not([type=checkbox])")&&n<N-1)go(n+1)});
document.addEventListener("click",async e=>{const b=e.target.closest("#S [data-a]");if(!b)return;const{a,k,i,s}=b.dataset,j=+i;const L=k&&(val(k)||(setv(k,[]),val(k)));
 if(a==="add"){snap();L.push(s?"":{});render();keep();const r=[...document.querySelectorAll("#S .grp")].pop();return(s?r:[...document.querySelectorAll("#S .cap")].pop()?.nextElementSibling)?.querySelector("input,textarea")?.focus()}
 if(a==="up"||a==="down"){snap();const q=a==="up"?j-1:j+1;[L[j],L[q]]=[L[q],L[j]];render();return keep()}
 if(a==="dup"){snap();L.splice(j+1,0,structuredClone(L[j]));render();return keep()}
 if(a==="del"){snap();L.splice(j,1);render();keep();return toast("Gelöscht",undo)}
 if(a==="copy"){await navigator.clipboard.writeText(JSON.stringify(out(),null,2));return toast("JSON kopiert")}
 if(a==="dl"){const o=out(),l=document.createElement("a");l.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,2)],{type:"application/json"}));l.download=slug(o.show?.title||"show")+".json";l.click();return toast("Datei erstellt")}
 if(a==="reset"){if(!confirm("Alle Eingaben auf diesem Gerät leeren? Firebase-Entwürfe bleiben erhalten."))return;snap();D={};n=0;render(1);keep();return toast("Zurückgesetzt",undo)}
 if(a==="cloud"){const name=slug($("#dn").value);localStorage.setItem("bhrt-onb-name",name);try{const{d,db}=await fb();await d.set(d.ref(db,"onboarding/drafts/"+name),{name,updated:d.serverTimestamp(),data:D});toast("Gespeichert: "+name)}catch(x){toast("Fehler: "+x.message)}return}
 try{const{d,db}=await fb();
  if(a==="del-draft"&&confirm("Entwurf „"+k+"“ löschen?"))await d.remove(d.ref(db,"onboarding/drafts/"+k));
  if(a==="load-draft"){const v=(await d.get(d.ref(db,"onboarding/drafts/"+k))).val();if(v){snap();D=v.data||{};render();keep();return toast("Geladen: "+k,undo)}}
  const v=(await d.get(d.ref(db,"onboarding/drafts"))).val()||{};
  $("#dl").innerHTML=`<div class="cap"><b>Entwürfe</b></div><div class="grp">${Object.values(v).map(r=>`<div class="r"><span style="flex:1;max-width:none">${esc(r.name)}</span><button class="skip" data-a="load-draft" data-k="${esc(r.name)}">Laden</button><button class="x" style="font-size:15px" data-a="del-draft" data-k="${esc(r.name)}">Löschen</button></div>`).join("")||'<div class="r">Noch keine Entwürfe.</div>'}</div>`}catch(x){toast("Firebase: "+x.message)}});
$("#S").addEventListener("change",async e=>{if(e.target.id!=="imp")return;try{const j=JSON.parse(await e.target.files[0].text());snap();D={...j,videos:j.videos||j.clips,ticker:j.ticker||j.tickers};render();keep();toast("Importiert",undo)}catch(x){toast("Ungültiges JSON")}});
try{const l=JSON.parse(localStorage.getItem("bhrt-onb")||"null");if(l){D=l.D||{};n=Math.min(l.n||0,N-1);toast("Entwurf wiederhergestellt")}}catch{}
render(1);
</script>
</body>
</html>
