<!DOCTYPE html>
<html lang="de" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARD Reporter App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            color-scheme: dark;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000000;
            color: #ffffff;
            -webkit-tap-highlight-color: transparent;
        }
        .glass {
            background-color: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .card-bg { background-color: #1c1c1e; }
        .border-subtle { border-color: #2c2c2e; }
        .text-apple-red { color: #ff453a; }
        .bg-apple-red { background-color: #ff453a; }
        .bg-apple-green { background-color: #30d158; }
        
        /* Smooth state transitions */
        #workflow-card { transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); }
        .station-group { transition: opacity 0.3s ease; }
        
        /* Pulse Animation */
        @keyframes ios-pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(48, 209, 88, 0.7); }
            70% { transform: scale(1.02); box-shadow: 0 0 0 20px rgba(48, 209, 88, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(48, 209, 88, 0); }
        }
        .btn-pulse-green { animation: ios-pulse 2s infinite; }
        
        @keyframes ios-pulse-red {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }
        .dot-pulse-red { animation: ios-pulse-red 1.5s infinite; }
        
        /* Hidden Scrollbar */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

    <header class="glass sticky top-0 z-50 border-b border-subtle flex justify-between items-center px-5 py-4 shrink-0">
        <div class="flex flex-col">
            <span class="text-xs font-semibold tracking-widest uppercase text-gray-400" id="nav-state-label">SYSTEMSTATUS</span>
            <span class="text-lg font-bold tracking-tight text-white" id="nav-state-text">Standby</span>
        </div>
        <div>
            <img src="https://upload.wikimedia.org/wikipedia/commons/2/23/Logo_ARD.svg" alt="ARD Logo" class="h-8 w-auto object-contain" onerror="this.style.display='none'">
        </div>
    </header>

    <main class="flex-1 overflow-y-auto pb-10">
        
        <div class="p-4 w-full max-w-md mx-auto">
            <div id="workflow-card" class="card-bg border border-subtle rounded-3xl p-6 shadow-2xl flex flex-col items-center justify-center min-h-[380px] relative overflow-hidden">
                </div>
        </div>

        <div class="px-4 w-full max-w-md mx-auto mt-2" id="directory-section">
            <div class="relative mb-6">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <svg class="h-5 w-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </div>
                <input type="search" id="search-input" placeholder="Sender suchen..." 
                    class="w-full card-bg border border-subtle rounded-[10px] py-2.5 pl-10 pr-4 text-white placeholder-gray-500 focus:outline-none focus:border-gray-400 text-base transition-colors">
            </div>

            <div id="directory-list" class="space-y-6">
                </div>
        </div>
    </main>

    <div id="alert-overlay" class="fixed inset-0 z-[100] hidden items-center justify-center p-4">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="App.hideAlert()"></div>
        <div class="card-bg border border-subtle rounded-2xl w-full max-w-[300px] text-center z-10 overflow-hidden shadow-2xl transform transition-transform scale-95">
            <div class="p-6">
                <h3 class="text-lg font-bold text-white mb-2 tracking-tight">Mikrofon erforderlich</h3>
                <p class="text-sm text-gray-400">Bitte erlaube den Mikrofonzugriff in deinen Browsereinstellungen, um auf Sendung zu gehen.</p>
            </div>
            <div class="border-t border-subtle flex">
                <button onclick="App.hideAlert()" class="w-full py-3.5 text-blue-500 font-semibold text-base active:bg-white/5 transition-colors">Verstanden</button>
            </div>
        </div>
    </div>

        };

        // --- CORE APPLICATION LOGIC ---
        const App = {
            state: 'STANDBY', // STANDBY, PREP, LIVE
            audioCtx: null,
            mediaStream: null,
            analyser: null,
            timerInterval: null,
            visualizerFrame: null,
            targetStation: null,

            init() {
                this.renderDirectory();
                this.setupSearch();
                this.renderStateStandby();
            },

            // --- AUDIO & PERMISSIONS ---
            async requestMicrophone() {
                try {
                    this.mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                    
                    if (!this.audioCtx) {
                        this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    }
                    if (this.audioCtx.state === 'suspended') {
                        await this.audioCtx.resume();
                    }
                    
                    // Setup Analyser
                    const source = this.audioCtx.createMediaStreamSource(this.mediaStream);
                    this.analyser = this.audioCtx.createAnalyser();
                    this.analyser.fftSize = 64; 
                    this.analyser.smoothingTimeConstant = 0.8;
                    source.connect(this.analyser);
                    
                    return true;
                } catch (err) {
                    this.showAlert();
                    return false;
                }
            },

            stopMicrophone() {
                if (this.mediaStream) {
                    this.mediaStream.getTracks().forEach(track => track.stop());
                    this.mediaStream = null;
                }
                if (this.visualizerFrame) {
                    cancelAnimationFrame(this.visualizerFrame);
                }
            },

            playBeep(frequency, durationMillis, type = 'sine') {
                if (!this.audioCtx) return;
                const osc = this.audioCtx.createOscillator();
                const gainNode = this.audioCtx.createGain();
                
                osc.type = type;
                osc.frequency.setValueAtTime(frequency, this.audioCtx.currentTime);
                
                gainNode.gain.setValueAtTime(0.1, this.audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + (durationMillis / 1000));
                
                osc.connect(gainNode);
                gainNode.connect(this.audioCtx.destination);
                
                osc.start();
                osc.stop(this.audioCtx.currentTime + (durationMillis / 1000));
            },

            // --- UI STATES ---
            updateNav(text, colorClass = "text-white") {
                const navText = document.getElementById('nav-state-text');
                navText.textContent = text;
                navText.className = `text-lg font-bold tracking-tight ${colorClass}`;
            },

            renderStateStandby() {
                this.state = 'STANDBY';
                this.updateNav('Standby');
                
                const card = document.getElementById('workflow-card');
                card.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full space-y-6">
                        <p class="text-gray-400 text-sm font-medium tracking-widest uppercase text-center">System bereit für Verbindung</p>
                        <button onclick="App.handleBereitClick()" 
                            class="w-44 h-44 rounded-full bg-apple-green text-white font-bold text-2xl tracking-tight btn-pulse-green shadow-[0_0_40px_rgba(48,209,88,0.4)] transition-transform active:scale-95 flex items-center justify-center">
                            BEREIT
                        </button>
                    </div>
                `;
            },

            async handleBereitClick() {
                const granted = await this.requestMicrophone();
                if (granted) {
                    this.renderStatePrep();
                }
            },

            renderStatePrep() {
                this.state = 'PREP';
                this.updateNav('Vorbereitung', 'text-yellow-500');
                
                // Pick random station
                const allAnstalten = appData.rundfunkanstalten;
                const rAnstalt = allAnstalten[Math.floor(Math.random() * allAnstalten.length)];
                this.targetStation = rAnstalt.sender[Math.floor(Math.random() * rAnstalt.sender.length)];

                const card = document.getElementById('workflow-card');
                card.innerHTML = `
                    <div class="flex flex-col items-center w-full animate-fade-in">
                        <span class="text-xs font-semibold tracking-widest uppercase text-gray-400 mb-2">Nächste Schalte auf</span>
                        <h2 class="text-2xl font-bold tracking-tight mb-4 text-center">${this.targetStation.name}</h2>
                        
                        <div class="bg-[#2c2c2e] p-3 rounded-xl mb-8 w-48 h-24 flex items-center justify-center">
                            <img src="${this.targetStation.logo}" alt="Logo" class="max-h-full max-w-full object-contain" onerror="this.style.display='none'">
                        </div>

                        <div class="relative flex items-center justify-center w-32 h-32 rounded-full border-4 border-yellow-500/30">
                            <svg class="absolute inset-0 w-full h-full -rotate-90">
                                <circle cx="50%" cy="50%" r="46%" fill="none" stroke="#eab308" stroke-width="8" stroke-dasharray="100 100" class="transition-all duration-1000 ease-linear" id="prep-circle"></circle>
                            </svg>
                            <span class="text-4xl font-light tabular-nums" id="prep-timer">01:00</span>
                        </div>
                    </div>
                `;

                this.startTimer(60, 
                    (timeLeft) => {
                        // Update UI
                        document.getElementById('prep-timer').textContent = this.formatTime(timeLeft);
                        
                        // Audio Signals
                        if (timeLeft === 3 || timeLeft === 2 || timeLeft === 1) {
                            this.playBeep(880, 150); // Short high beep
                        }
                    },
                    () => {
                        this.playBeep(880, 600); // Long confirmation beep
                        this.renderStateLive();
                    }
                );
            },

            renderStateLive() {
                this.state = 'LIVE';
                this.updateNav('ON AIR', 'text-apple-red');

                const card = document.getElementById('workflow-card');
                card.innerHTML = `
                    <div class="flex flex-col items-center w-full w-full animate-fade-in">
                        <div class="flex items-center space-x-3 mb-6">
                            <div class="w-4 h-4 bg-apple-red rounded-full dot-pulse-red"></div>
                            <span class="text-apple-red font-bold tracking-widest text-xl">LIVE</span>
                        </div>
                        
                        <div class="bg-[#2c2c2e] p-4 rounded-xl mb-6 w-56 h-28 flex items-center justify-center shadow-lg border border-subtle">
                            <img src="${this.targetStation.logo}" alt="Logo" class="max-h-full max-w-full object-contain" onerror="this.style.display='none'">
                        </div>

                        <div class="text-6xl font-light tabular-nums mb-8 tracking-tighter" id="live-timer">02:00</div>
                        
                        <div class="w-full h-16 flex items-end justify-center space-x-1" id="visualizer-container">
                            <canvas id="visualizer-canvas" width="280" height="64"></canvas>
                        </div>
                    </div>
                `;

                this.startVisualizer();

                this.startTimer(120, 
                    (timeLeft) => {
                        document.getElementById('live-timer').textContent = this.formatTime(timeLeft);
                    },
                    () => {
                        // Double beep for end
                        this.playBeep(600, 150);
                        setTimeout(() => this.playBeep(600, 150), 250);
                        
                        this.stopMicrophone();
                        this.renderStateStandby();
                    }
                );
            },

            // --- HELPERS ---
            startTimer(seconds, onTick, onComplete) {
                if (this.timerInterval) clearInterval(this.timerInterval);
                let timeLeft = seconds;
                
                this.timerInterval = setInterval(() => {
                    timeLeft--;
                    if (timeLeft >= 0) {
                        onTick(timeLeft);
                    } else {
                        clearInterval(this.timerInterval);
                        onComplete();
                    }
                }, 1000);
            },

            formatTime(seconds) {
                const m = Math.floor(seconds / 60).toString().padStart(2, '0');
                const s = (seconds % 60).toString().padStart(2, '0');
                return `${m}:${s}`;
            },

            startVisualizer() {
                const canvas = document.getElementById('visualizer-canvas');
                if (!canvas || !this.analyser) return;
                const ctx = canvas.getContext('2d');
                const bufferLength = 16; // 16 bars
                const dataArray = new Uint8Array(this.analyser.frequencyBinCount);
                
                const draw = () => {
                    if (this.state !== 'LIVE') return;
                    this.visualizerFrame = requestAnimationFrame(draw);
                    this.analyser.getByteFrequencyData(dataArray);
                    
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    
                    const barWidth = (canvas.width / bufferLength) - 2;
                    let x = 0;
                    
                    for (let i = 0; i < bufferLength; i++) {
                        // Map frequency data to height
                        const barHeight = (dataArray[i] / 255) * canvas.height;
                        
                        ctx.fillStyle = '#ff453a';
                        
                        // Draw iOS-style rounded bar
                        ctx.beginPath();
                        ctx.roundRect(x, canvas.height - barHeight, barWidth, barHeight, 4);
                        ctx.fill();
                        
                        x += barWidth + 2;
                    }
                };
                draw();
            },

            // --- DIRECTORY & SEARCH ---
            renderDirectory() {
                const list = document.getElementById('directory-list');
                list.innerHTML = '';

                appData.rundfunkanstalten.forEach(anstalt => {
                    const groupDiv = document.createElement('div');
                    groupDiv.className = 'station-group card-bg border border-subtle rounded-2xl overflow-hidden';
                    
                    // Group Header
                    const header = document.createElement('div');
                    header.className = 'bg-[#2c2c2e]/50 px-4 py-3 flex items-center justify-between border-b border-subtle';
                    header.innerHTML = `
                        <span class="font-semibold text-sm tracking-tight">${anstalt.anstalt}</span>
                        <img src="${anstalt.anstalt_logo}" class="h-5 w-auto object-contain" onerror="this.style.display='none'">
                    `;
                    groupDiv.appendChild(header);

                    // Stations List
                    const stationsDiv = document.createElement('div');
                    stationsDiv.className = 'divide-y divide-subtle';
                    
                    anstalt.sender.forEach(sender => {
                        const itemDiv = document.createElement('div');
                        itemDiv.className = 'station-item flex items-center p-4 hover:bg-white/5 transition-colors cursor-default';
                        itemDiv.dataset.name = sender.name.toLowerCase();
                        
                        itemDiv.innerHTML = `
                            <div class="h-10 w-16 bg-[#2c2c2e] rounded flex items-center justify-center mr-4 shrink-0 overflow-hidden">
                                <img src="${sender.logo}" class="max-h-full max-w-full object-contain" onerror="this.style.display='none'">
                            </div>
                            <span class="text-base font-medium">${sender.name}</span>
                        `;
                        stationsDiv.appendChild(itemDiv);
                    });

                    groupDiv.appendChild(stationsDiv);
                    list.appendChild(groupDiv);
                });
            },

            setupSearch() {
                const searchInput = document.getElementById('search-input');
                searchInput.addEventListener('input', (e) => {
                    const term = e.target.value.toLowerCase();
                    const groups = document.querySelectorAll('.station-group');
                    
                    groups.forEach(group => {
                        let hasVisibleChild = false;
                        const items = group.querySelectorAll('.station-item');
                        
                        items.forEach(item => {
                            if (item.dataset.name.includes(term)) {
                                item.style.display = 'flex';
                                hasVisibleChild = true;
                            } else {
                                item.style.display = 'none';
                            }
                        });
                        
                        group.style.display = hasVisibleChild ? 'block' : 'none';
                    });
                });
            },

            // --- UI ALERTS ---
            showAlert() {
                const overlay = document.getElementById('alert-overlay');
                overlay.classList.remove('hidden');
                overlay.classList.add('flex');
                setTimeout(() => {
                    overlay.querySelector('.card-bg').classList.remove('scale-95');
                    overlay.querySelector('.card-bg').classList.add('scale-100');
                }, 10);
            },

            hideAlert() {
                const overlay = document.getElementById('alert-overlay');
                overlay.querySelector('.card-bg').classList.remove('scale-100');
                overlay.querySelector('.card-bg').classList.add('scale-95');
                setTimeout(() => {
                    overlay.classList.add('hidden');
                    overlay.classList.remove('flex');
                }, 200);
            }
        };

        // Initialize App on DOM Content Loaded
        document.addEventListener('DOMContentLoaded', () => {
            App.init();
        });

    </script>
</body>
</html>
